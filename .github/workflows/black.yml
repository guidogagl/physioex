name: Lint

# black solo dove conta (main, physioex-dev e PR): i branch di ricerca si formattano al merge
# (05.11.2026, il Lint falliva a ogni push di feat/clean-channels e feat/merged-pretrain)
on:
  push:
    branches: [main, physioex-dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: psf/black@stable
        with:
          options: "--verbose"
          src: "./physioex"
          jupyter: true
          version: "~= 22.0"