name: test
on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU torch (avoid large CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev + legacy extras
        run: pip install .[dev,legacy]

      - name: Run test suite (script-style; data-gated tests self-skip)
        env:
          # Real-data tests self-skip when this is unset.
          PHYSIOEX_TEST_REAL_DATA: ""
        run: |
          fail=0
          # Run as modules from repo root so intra-`tests` imports resolve.
          for f in tests/test_*.py; do
            name="tests.$(basename "$f" .py)"
            echo "::group::$name"
            python -m "$name" || { echo "FAILED: $name"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
