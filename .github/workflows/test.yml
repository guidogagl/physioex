name: test
on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch (avoid large CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev + legacy extras
        run: pip install .[dev,legacy]

      - name: Run test suite with coverage gate
        env:
          # Gated markers self-skip / deselect when their environment is absent:
          #   real_data -> PHYSIOEX_TEST_REAL_DATA, hf -> PHYSIOEX_TEST_HF, gpu -> CUDA.
          PHYSIOEX_TEST_REAL_DATA: ""
          PHYSIOEX_TEST_HF: ""
        run: |
          pytest -m "not real_data and not gpu and not hf" \
            --cov=physioex \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
