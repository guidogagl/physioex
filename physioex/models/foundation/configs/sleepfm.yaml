# SleepFM — Sleep Foundation Model (Thapa et al., ICML 2024 / Nat Med 2025)
# BAS (brain-activity-signals) branch: SetTransformer over 10 channel slots.
# z-score normalization; zero-pads to 10 channels.

model_name: sleepfm
sampling_rate: 128
embedding_dim: 128
epoch_seconds: 30

# Channel handling — fixed 10-slot BAS (brain activity signals)
target_layout: null  # no named layout; pads up to bas_channels=10
channel_aliases: {}
missing_strategy: zero_pad

# Preprocessing
normalization: zscore  # per-sample z-score (or per-recording if stats available)
normalization_params:
  eps: 1.0e-6

# Encoder config
patch_size: 640   # 5 s × 128 Hz
bas_channels: 10
num_heads: 8
num_layers: 6
pooling_head: 8
max_seq_length: 128

# Encoding
embedding_reduction: temporal_attention_pooling
