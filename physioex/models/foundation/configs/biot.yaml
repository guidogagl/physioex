# BIOT — Biosignal IO Transformer (Yang et al., NeurIPS 2023)
# Fixed 16-channel double-banana montage (PREST pretraining).
# Computes bipolar derivations from available unipolar electrodes.

model_name: biot
sampling_rate: 200
embedding_dim: 256
epoch_seconds: 30

# Channel handling — 16 bipolar double-banana slots
target_layout:
  - FP1-F7
  - F7-T7
  - T7-P7
  - P7-O1
  - FP2-F8
  - F8-T8
  - T8-P8
  - P8-O2
  - FP1-F3
  - F3-C3
  - C3-P3
  - P3-O1
  - FP2-F4
  - F4-C4
  - C4-P4
  - P4-O2

# Derivation pairs: each slot is anode-cathode
bipolar_derivations:
  FP1-F7: [FP1, F7]
  F7-T7: [F7, T7]
  T7-P7: [T7, P7]
  P7-O1: [P7, O1]
  FP2-F8: [FP2, F8]
  F8-T8: [F8, T8]
  T8-P8: [T8, P8]
  P8-O2: [P8, O2]
  FP1-F3: [FP1, F3]
  F3-C3: [F3, C3]
  C3-P3: [C3, P3]
  P3-O1: [P3, O1]
  FP2-F4: [FP2, F4]
  F4-C4: [F4, C4]
  C4-P4: [C4, P4]
  P4-O2: [P4, O2]

channel_aliases:
  T3: T7
  T4: T8
  T5: P7
  T6: P8

missing_strategy: zero_pad

# Preprocessing
normalization: q95  # per-channel 95th-percentile
normalization_params:
  q: 0.95
  eps: 1.0e-8
  mean_center: true  # DC removal before q95
