# TF-C — Time-Frequency Consistency (Zhang et al., NeurIPS 2022)
# Single-channel model: takes 1 EEG channel, center-crops to 178 samples.
# Embedding = concat(h_time, h_freq) → (B, 356).

model_name: tfc
sampling_rate: 100
embedding_dim: 356
epoch_seconds: 30

# Channel handling — single channel (best-match selection)
target_layout: null  # single channel selected by preference order
channel_aliases: {}
missing_strategy: zero_pad
channel_preference:
  - FPZ
  - FZ
  - CZ
  - C3
  - C4
  - FP1
  - F3
  - F4
  - O1

# Preprocessing
normalization: none
normalization_params: {}

# Encoding
ts_length_aligned: 178  # center-crop after resampling
embedding_reduction: concat_time_freq  # cat([h_time, h_freq])
