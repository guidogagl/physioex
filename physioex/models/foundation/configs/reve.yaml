# REVE — Representations from EEG via Vision-language model (Chau et al., 2024)
# Channel-name-aware via position bank. Per-recording z-score + ±15σ clip.
# Embedding = mean over patches and channels → (B, 512).

model_name: reve
sampling_rate: 200
embedding_dim: 512
epoch_seconds: 30

# Channel handling — variable, uses position bank for channel-aware positions
target_layout: null  # variable: position bank resolves channel positions
channel_aliases:
  # Bipolar → standard 10-20
  C3-A2: C3
  C4-A1: C4
  O1-A2: O1
  O2-A1: O2
  F3-A2: F3
  F4-A1: F4
  FZ-CZ: FZ
  CZ-PZ: PZ
  T3: T7
  T4: T8
  T5: P7
  T6: P8
missing_strategy: drop  # unmatched channels dropped

# Preprocessing
normalization: zscore_clip  # per-recording z-score + ±15σ clip
normalization_params:
  sigma_clip: 15.0
  eps: 1.0e-6
  mean_center: true

# Model source
model_source: brain-bzh/reve-base
pos_bank_source: brain-bzh/reve-positions

# Encoding
embedding_reduction: mean_over_channels_and_patches  # out.mean(dim=2).mean(dim=1)
